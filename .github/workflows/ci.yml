name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, unit tests, integration, build, E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        # Supabase-shaped PostGIS (extensions schema) — 0_Phase.md §1 trap 3.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentuz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentuz?schema=public&search_path=public,extensions
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rentuz?search_path=public,extensions
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostGIS + Redis)
        run: pnpm --filter api test:integration

      # Trap 15: integration suites truncate the seed — reseed before E2E.
      - name: Migrate + seed for E2E
        run: |
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api db:seed
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          PUBLIC_STORAGE_BASE_URL: http://localhost:9000/rentuz-public

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

      - name: Bundle budget (§68)
        run: pnpm --filter web size-check

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Playwright E2E (includes a11y suite)
        run: pnpm --filter web test:e2e
        env:
          NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  gitleaks:
    name: Secrets scan (§74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    name: Lighthouse CI (§68)
    runs-on: ubuntu-latest
    needs: ci
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rentuz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rentuz?schema=public&search_path=public,extensions
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/rentuz?search_path=public,extensions
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate + seed + build
        run: |
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api db:seed
          pnpm --filter api build
          NEXT_PUBLIC_SOCKET_URL=http://localhost:4000 pnpm --filter web build
        env:
          STORAGE_ENDPOINT: http://localhost:9000
          PUBLIC_STORAGE_BASE_URL: http://localhost:9000/rentuz-public

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  # Deploy: Vercel + Render ship via their own GitHub integrations on push
  # to main — CI green is the gate; no deploy secrets live in this workflow
  # (§77 / 8_Phase.md §1.6 item 39).
